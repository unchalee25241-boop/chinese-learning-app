<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Easy Chinese — Flashcard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card-page">
    <header class="card-header">
      <a href="index.html" class="back-link" aria-label="กลับหน้าหลัก">←</a>
      <div class="progress">
        <span class="progress-current" id="progressCurrent">1</span>
        <span class="progress-sep">/</span>
        <span class="progress-total" id="progressTotal">3</span>
      </div>
    </header>

    <section class="card" id="card">
      <p class="label">Traditional</p>
      <h1 class="hanzi" id="traditional">—</h1>

      <p class="label">Simplified</p>
      <h2 class="hanzi-sm" id="simplified">—</h2>

      <p class="pinyin" id="pinyin">—</p>
      <p class="zhuyin" id="zhuyin">—</p>

      <button class="audio-btn" id="playBtn" aria-label="ฟังเสียงคำอ่าน">
        <span class="audio-icon">▶</span>
        <span class="audio-label" id="audioLabel">ฟังออกเสียง</span>
      </button>

      <div class="meaning">
        <p class="label">คำแปล</p>
        <div class="thai-box">
          <p class="thai" id="thai">—</p>
        </div>
      </div>

          <div class="example">
        <p class="label">ตัวอย่างประโยค</p>
        <p class="example-zh" id="exampleZh">—</p>
        <p class="example-pinyin" id="examplePinyin">—</p>
        <p class="example-thai" id="exampleThai">—</p>
        <button class="audio-btn audio-btn-sm" id="playSentenceBtn" aria-label="ฟังเสียงประโยคตัวอย่าง">
          <span class="audio-icon">▶</span>
          <span class="audio-label" id="sentenceAudioLabel">ฟังประโยค</span>
        </button>
      </div>


      <!-- Reserved space for future "memory tip" feature — do not implement yet -->
      <div class="memory-tip" id="memoryTip"></div>
    </section>

    <!-- Shown only when the user reaches the last card -->
    <p class="complete-msg" id="completeMsg" hidden>🎉 เยี่ยมมาก! คุณฟังครบทุกคำใน Starter Pack แล้ว</p>

    <!-- Shown only if cards.json fails to load or returns no data -->
    <div class="load-error" id="loadError" hidden>
      <p>ขออภัย ขณะนี้โหลดข้อมูลคำศัพท์ไม่สำเร็จ</p>
      <button class="nav-btn nav-btn-primary" id="retryBtn">ลองใหม่</button>
      <a href="index.html" class="nav-btn">กลับหน้าหลัก</a>
    </div>

    <nav class="card-nav" id="cardNav">
      <button class="nav-btn" id="prevBtn">‹ ก่อนหน้า</button>
      <button class="nav-btn" id="nextBtn">ถัดไป ›</button>
    </nav>

    <nav class="card-nav" id="completeNav" hidden>
      <a href="index.html" class="nav-btn">🏠 กลับหน้าหลัก</a>
      <a href="card.html?id=1&dir=prev" class="nav-btn nav-btn-primary">🔁 ทบทวนอีกครั้ง</a>
    </nav>

       <audio id="audioPlayer" preload="none"></audio>
    <audio id="sentenceAudioPlayer" preload="none"></audio>

  </main>

  <script src="script.js"></script>
</body>
</html>
